name: CI

on:
  push:
    branches: [main, hcltech-round2-final]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pathfinder
          POSTGRES_PASSWORD: pathfinder
          POSTGRES_DB: pathfinder
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pathfinder -d pathfinder"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg2://pathfinder:pathfinder@localhost:5432/pathfinder
      PATHFINDER_AI_PROVIDER: stub
      PATHFINDER_SEMANTIC_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Migrate and seed
        working-directory: backend
        run: |
          alembic upgrade head
          cd ..
          python scripts/validate_ontology.py
          python scripts/seed.py
      - name: Pytest
        run: python -m pytest -q
      - name: Intelligence benchmark
        run: python scripts/intelligence_benchmark.py

  frontend:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install and test
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build
