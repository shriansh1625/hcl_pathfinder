# Slice 2 recommendation weights. Prototype hypothesis, not measured truth.
# Components are each in [0, 1]. Final score is a convex combination (weights sum to 1).

weights:
  skill_gap_fit: 0.30
  role_importance: 0.20
  prerequisite_fit: 0.15
  difficulty_fit: 0.10
  duration_fit: 0.10
  learning_style_fit: 0.10
  semantic_similarity: 0.05

selection:
  default_weekly_hours: 8
  default_learning_style: MIXED
  horizon_weeks: 8
  max_items: 12
  min_coverage: 0.35
  max_verification_gates: 8

eligibility:
  unknown_prerequisite_fit: 0.45
  unsatisfied_prerequisite_fit: 0.10

semantic:
  # Neutral placeholder until an embedding backend exists. Must not dominate ranking.
  fallback_similarity: 0.50
